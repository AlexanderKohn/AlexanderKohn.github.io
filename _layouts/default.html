<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  </head>
  <body>
    <div class="wrap">
      <header class="site-header{% if page.home %} is-home{% endif %}">
        {% if page.home %}
        <h1 class="site-name">{{ site.title }}</h1>
        {% else %}
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        {% endif %}
        <nav>
          <a href="{{ '/assets/Kohn_Resume_2026.pdf' | relative_url }}">Résumé</a>
          <a href="https://github.com/AlexanderKohn">GitHub</a>
          <a href="https://www.linkedin.com/in/alexander-kohn/">LinkedIn</a>
          <a href="https://scholar.google.com/citations?user=Y4YtkbcAAAAJ">Scholar</a>
          <a href="mailto:awolfekohn@gmail.com">Email</a>
        </nav>
      </header>
      <main>
{{ content }}
      </main>
      <footer class="site-footer">
        <a href="mailto:awolfekohn@gmail.com">awolfekohn@gmail.com</a>
      </footer>
    </div>
  </body>
</html>
