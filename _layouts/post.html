---
layout: default
---
<article class="post grid">
  <p class="post-meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  <h1 class="post-title">{{ page.title }}</h1>
{{ content }}
  <p class="post-end"><a href="{{ '/' | relative_url }}">&larr; Home</a></p>
</article>
